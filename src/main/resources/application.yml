spring:
  application:
    name: sistema-core
  profiles:
    default: dev
server:
  port: ${SERVER_PORT:8080}
app:
  zone-id: ${APP_ZONE_ID:UTC}
jwt:
  secret: ${JWT_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
