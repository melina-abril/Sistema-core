spring:
  application:
    name: sistema-core
  profiles:
    default: dev
  jackson:
    time-zone: UTC
  datasource:
    url: ${ORACLE_JDBC_URL:}
    username: ${ORACLE_USER:}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
core:
  security:
    jwt-secret: ${JWT_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
